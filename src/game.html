<style>
/* GAME 小按鈕 */
.game-fab { position: fixed; right: 18px; bottom: 18px; z-index: 120; display: grid; place-items: center; width: 84px; height: 84px; padding: 0; border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 50%; background: rgba(250, 251, 249, 0.55); -webkit-backdrop-filter: blur(14px) saturate(1.5); backdrop-filter: blur(14px) saturate(1.5); box-shadow: 0 12px 30px rgba(18, 22, 23, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.9); cursor: pointer; }
.game-fab img { width: 74px; height: auto; margin-top: -10px; pointer-events: none; }
.game-fab span { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); padding: 2px 10px; border-radius: var(--radius-pill); background: var(--color-ink-3); color: var(--color-yellow); font: 400 12px/1.5 var(--font-round); letter-spacing: 0.12em; }
.game-fab:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.game-fab .dot { position: absolute; top: 4px; right: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--color-orange); box-shadow: 0 0 0 3px rgba(250, 251, 249, 0.9); }
.game-open .game-fab { visibility: hidden; }
/* 手機：按鈕縮小；首頁主視覺、家長查詢框在畫面上或正在打字時先收起來（game.js 加 is-tucked） */
.game-fab { transition: transform var(--dur-med) var(--ease-out), opacity var(--dur-med) var(--ease-out), visibility 0s; }
.game-fab.is-tucked { transform: translateY(calc(100% + 32px)); opacity: 0; visibility: hidden; pointer-events: none; transition: transform var(--dur-med) var(--ease-out), opacity var(--dur-med) var(--ease-out), visibility 0s var(--dur-med); }
@media (max-width: 640px) { .game-fab { width: 56px; height: 56px; right: 12px; bottom: 16px; } .game-fab img { width: 50px; margin-top: -6px; } .game-fab span { bottom: -7px; padding: 1px 7px; font-size: 9px; } .game-fab .dot { top: 1px; right: 2px; width: 10px; height: 10px; } }
@media (prefers-reduced-motion: reduce) { .game-fab, .game-fab.is-tucked { transition: none; } }
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  .game-fab { background: var(--color-paper); border-color: var(--color-rule-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* 遊戲視窗 */
.game { position: fixed; inset: 0; z-index: 300; display: grid; overflow: auto; overscroll-behavior: contain; color: var(--color-ink); }
.game[hidden] { display: none; }
.game .g-bg { position: fixed; inset: 0; background: radial-gradient(circle at 15% 10%, rgba(248, 150, 63, 0.55), transparent 45%), radial-gradient(circle at 90% 85%, rgba(143, 180, 232, 0.6), transparent 50%), rgba(18, 22, 23, 0.72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.game .g-shell { position: relative; width: min(1180px, 100% - 24px); margin: 12px auto; padding: clamp(16px, 2.5vw, 28px); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.7); background: rgba(250, 251, 249, 0.86); -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35); align-self: start; }
.game .g-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-sm) var(--space-lg); padding-bottom: var(--space-md); border-bottom: 1px solid var(--color-rule); }
.game .g-k { font: 600 var(--text-xs)/1.5 var(--font-mono); letter-spacing: 0.16em; color: var(--color-orange-ink); }
.game h2 { font-family: var(--font-display); font-weight: 900; font-size: var(--text-2xl); line-height: 1.25; }
.game .g-meta { display: flex; align-items: center; gap: var(--space-sm); }
.game .g-count { font: 600 var(--text-sm)/1 var(--font-mono); color: var(--color-ink-2); }
.game .g-count b { color: var(--color-orange-ink); font-size: var(--text-lg); }
.game .g-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 var(--space-md); border: 1.5px solid var(--color-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-ink); font: 700 var(--text-sm)/1 var(--font-body); text-decoration: none; cursor: pointer; }
.game .g-btn.is-main { background: var(--color-orange); border-color: var(--color-orange); color: var(--color-ink); }
.game .g-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.game .g-btn:focus-visible, .game .g-spot:focus-visible, .game .g-opt:focus-visible, .game .g-close:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
.game .g-close { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--color-ink); color: var(--color-on-ink); font-size: 22px; line-height: 1; cursor: pointer; }
.game .g-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: var(--space-lg); margin-top: var(--space-lg); }

/* 地圖 */
.game .g-map { position: relative; display: grid; gap: var(--space-sm); align-content: start; }
.game .g-zone { position: relative; padding: var(--space-md); border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.9); background: rgba(255, 255, 255, 0.55); box-shadow: 0 8px 24px rgba(28, 33, 34, 0.06); }
.game .g-zone[data-zone="field"] { background: linear-gradient(135deg, rgba(134, 239, 172, 0.35), rgba(255, 255, 255, 0.6)); }
.game .g-zone[data-zone="canteen"] { background: linear-gradient(135deg, rgba(253, 186, 116, 0.4), rgba(255, 255, 255, 0.6)); }
.game .g-zone[data-zone="hall"] { background: linear-gradient(135deg, rgba(147, 197, 253, 0.42), rgba(255, 255, 255, 0.6)); }
.game .g-zone h3 { display: flex; align-items: baseline; gap: var(--space-xs); font-weight: 900; font-size: var(--text-lg); }
.game .g-zone h3 small { font: 600 var(--text-xs)/1 var(--font-mono); letter-spacing: 0.14em; color: var(--color-ink-2); }
.game .g-zone .g-solved { margin-left: auto; padding: 2px 10px; border-radius: var(--radius-pill); background: var(--color-ink); color: var(--color-yellow); font-size: var(--text-sm); }
.game .g-spots { display: grid; gap: var(--space-xs); margin-top: var(--space-sm); }
.game .g-spot { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: var(--space-sm); min-height: 52px; padding: 6px var(--space-sm); border: 1px solid var(--color-rule); border-radius: 14px; background: rgba(255, 255, 255, 0.75); color: var(--color-ink); text-align: left; font: 500 var(--text-base)/1.35 var(--font-body); cursor: pointer; transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.game .g-spot:hover { transform: translateX(3px); border-color: var(--color-orange); }
.game .g-spot .n { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--color-ink); color: var(--color-on-ink); font: 600 var(--text-sm)/1 var(--font-mono); }
.game .g-spot .pips { display: flex; gap: 4px; }
.game .g-spot .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--color-orange-ink); }
.game .g-spot .pips i.on { background: var(--color-orange); border-color: var(--color-orange); }
.game .g-spot.is-done { border-color: var(--color-orange); background: var(--color-orange-tint); }
.game .g-spot.is-done .n { background: var(--color-orange); color: var(--color-ink); }
.game .g-spot b { display: inline-block; margin-left: 0.6em; white-space: nowrap; color: var(--color-orange-ink); }
.game .g-bigbtn { width: 100%; margin-top: var(--space-sm); }
.game .g-final { margin-top: var(--space-xs); }
.game .g-avatar { position: absolute; left: 0; top: 0; z-index: 3; width: 74px; height: auto; pointer-events: none; filter: drop-shadow(0 8px 10px rgba(28, 33, 34, 0.25)); }

/* 推理板 */
.game .g-board { position: sticky; top: 12px; align-self: start; padding: var(--space-md); border-radius: 18px; background: linear-gradient(160deg, rgba(28, 33, 34, 0.94), rgba(18, 22, 23, 0.96)); color: var(--color-on-ink); overflow: hidden; }
.game .g-board h3 { display: flex; justify-content: space-between; font: 600 var(--text-xs)/1.5 var(--font-mono); letter-spacing: 0.16em; color: var(--color-yellow); }
.game .g-strings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.game .g-strings path { fill: none; stroke: #EF4444; stroke-width: 2; stroke-linecap: round; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5)); }
.game .g-cols { position: relative; z-index: 2; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-sm); margin-top: var(--space-sm); }
.game .g-col > p { padding: 6px; border-radius: 10px; text-align: center; font-weight: 900; font-size: var(--text-base); border: 1.5px dashed rgba(250, 251, 249, 0.3); color: var(--color-on-ink-muted); }
.game .g-col > p.on { border: 0; background: var(--color-yellow); color: var(--color-ink); }
.game .g-grp { margin-top: var(--space-sm); }
.game .g-grp .lab { display: block; margin: 0 auto 6px; width: fit-content; padding: 2px 10px; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 700; background: rgba(250, 251, 249, 0.1); color: var(--color-on-ink-muted); }
.game .g-grp .lab.on { background: var(--color-orange); color: var(--color-ink); }
.game .g-slots { display: grid; gap: 5px; }
.game .g-slot { display: grid; place-items: center; min-height: 44px; padding: 2px 4px; border-radius: 6px; border: 1px dashed rgba(250, 251, 249, 0.25); font-size: 14px; font-weight: 700; line-height: 1.2; text-align: center; color: rgba(250, 251, 249, 0.35); }
.game .g-slot.on { border: 0; background: #E8EDE8; color: var(--color-ink); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25); transform: rotate(-1.5deg); }
.game .g-slot.on:nth-child(2) { transform: rotate(1.5deg); }
.game .g-truth { position: relative; z-index: 2; margin-top: var(--space-md); padding: var(--space-sm); border-radius: 12px; text-align: center; font-family: var(--font-display); font-weight: 900; font-size: var(--text-xl); border: 1.5px dashed rgba(250, 251, 249, 0.3); color: var(--color-on-ink-muted); }
.game .g-truth.on { border: 0; background: linear-gradient(90deg, var(--color-orange), var(--color-yellow)); color: var(--color-ink); }

/* 注音：每個中文字右邊一欄直排注音，聲調在最後一個符號的右上角，輕聲點在最上面 */
.game .zy { display: inline-flex; align-items: center; }
.game .zy-b { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; min-width: 1em; margin: 0 0.08em 0 0.02em; padding-right: 0.42em; font: 500 max(0.46em, 9px)/1 var(--font-body); font-style: normal; letter-spacing: 0; text-transform: none; }
.game .zy-b > span { position: relative; display: block; line-height: 1.02; }
.game .zy-b .zy-l { width: 0.24em; height: 0.24em; margin-bottom: 0.1em; border-radius: 50%; background: currentColor; }
.game .zy-b .zy-t { position: absolute; left: 86%; top: -0.25em; width: 0.5em; height: 0.5em; }
.game .zy-t svg { display: block; width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* 題目卡 */
.game .g-card { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: rgba(18, 22, 23, 0.45); }
.game .g-card[hidden] { display: none; }
.game .g-panel { position: relative; width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: var(--space-xl) var(--space-lg) var(--space-lg); border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.8); background: rgba(250, 251, 249, 0.95); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35); }
.game .g-panel .xz { display: block; width: 120px; height: auto; margin: -8px auto var(--space-xs); }
.game .g-step { font: 600 var(--text-xs)/1.5 var(--font-mono); letter-spacing: 0.14em; color: var(--color-orange-ink); text-align: center; }
.game .g-q { margin-top: var(--space-xs); font-weight: 700; font-size: 1.25rem; line-height: 1.7; text-align: center; }
.game .g-opts { display: grid; gap: var(--space-xs); margin-top: var(--space-lg); }
.game .g-opt { min-height: 56px; padding: 8px var(--space-md); border: 1.5px solid var(--color-ink); border-radius: 14px; background: #fff; color: var(--color-ink); font: 700 1.0625rem/1.4 var(--font-body); text-align: left; cursor: pointer; }
.game .g-opt:hover { background: var(--color-orange-tint); }
.game .g-opt.is-right { background: #BBF7D0; border-color: #15803D; }
.game .g-opt.is-wrong { background: #FECACA; border-color: #B91C1C; }
.game .g-hint { min-height: 1.6em; margin-top: var(--space-sm); text-align: center; color: var(--color-orange-ink); font-weight: 700; }
.game .g-panel .g-row { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-xs); margin-top: var(--space-lg); }
.game .g-panel .g-x { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; }
.game .g-panel input { width: 100%; min-height: 48px; margin-top: var(--space-sm); padding: 0 var(--space-md); border: 1.5px solid var(--color-ink); border-radius: 12px; font: 500 var(--text-base)/1.4 var(--font-body); }
.game .g-panel canvas, .game .g-panel .g-cert { display: block; width: 100%; height: auto; margin-top: var(--space-md); border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); }
.game .g-reveal { margin-top: var(--space-sm); text-align: center; line-height: 1.8; }
.game .g-confetti { position: fixed; inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
.game .g-confetti i { position: absolute; top: -20px; width: 10px; height: 14px; border-radius: 2px; }
@media (max-width: 860px) {
  .game .g-body { grid-template-columns: minmax(0, 1fr); }
  .game .g-board { position: relative; top: 0; }
  .game .g-shell { width: calc(100% - 16px); margin: 8px auto; border-radius: 18px; }
}
@media (max-width: 600px) {
  /* 手機：三區上下排，每區的三個地點並排 */
  .game .g-cols { grid-template-columns: minmax(0, 1fr); gap: var(--space-md); }
  .game .g-col { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 6px; }
  .game .g-col > p { grid-column: 1 / -1; }
  .game .g-board { padding: var(--space-sm); }
  .game .g-slot { padding: 2px 0; font-size: 13px; }
}
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  .game .g-bg { background: rgba(18, 22, 23, 0.94); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .game .g-shell, .game .g-panel { background: var(--color-paper); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
</style>
