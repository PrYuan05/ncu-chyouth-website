<!-- title: 校方專區頁首 | body: is-paper | plugins: -->
<style>
/* 各專區頁首用暖色紙底，和首頁一樣；深藍只留給最上面的頁首列和頁尾 */
#h-school { padding-top: var(--space-2xl); padding-bottom: var(--space-2xl); background: radial-gradient(ellipse at 85% 0%, #FFE7CC, transparent 55%), var(--color-paper); border-bottom: 1px solid var(--color-rule); }
#h-school .back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: var(--text-sm); color: var(--color-ink-2); text-decoration: none; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out); }
#h-school .back:hover { color: var(--color-orange-ink); }
#h-school .back:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; transition: none; }
#h-school .grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--space-2xl); align-items: end; margin-top: var(--space-lg); }
#h-school .kicker { font-size: var(--text-sm); font-weight: 700; letter-spacing: 0.06em; color: var(--color-orange-ink); }
#h-school h1 { margin-top: var(--space-xs); font-family: var(--font-display); font-weight: 900; font-size: clamp(2.25rem, 1.5rem + 3.5vw, 4rem); line-height: 1.15; }
#h-school .lead { margin-top: var(--space-md); color: var(--color-ink-2); font-size: var(--text-lg); max-width: 28em; }
#h-school .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--color-rule-strong); }
#h-school .facts div { padding: var(--space-md) var(--space-sm) 0 0; }
#h-school .facts dt { font-size: var(--text-xs); color: var(--color-ink-2); }
#h-school .facts dd { margin-top: 2px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--text-xl); color: var(--color-orange-ink); line-height: 1.3; }
#h-school .facts dd small { display: block; font-family: var(--font-body); font-size: var(--text-xs); font-weight: 400; color: var(--color-ink-2); }
#h-school .toc { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); margin-top: var(--space-2xl); padding-top: var(--space-md); border-top: 1px solid var(--color-rule); font-size: var(--text-sm); color: var(--color-ink-2); counter-reset: toc; }
#h-school .toc li { display: flex; align-items: center; gap: 6px; counter-increment: toc; }
#h-school .toc a { display: inline-flex; align-items: center; min-height: 40px; color: inherit; text-decoration: none; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out); }
#h-school .toc a:hover { color: var(--color-ink); }
#h-school .toc a:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
#h-school .toc li::before { content: counter(toc, decimal-leading-zero) " "; font-family: var(--font-mono); color: var(--color-orange-ink); }
@media (max-width: 860px) {
  #h-school .grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
}
@media (max-width: 480px) {
  #h-school .facts { grid-template-columns: minmax(0, 1fr); }
  #h-school .facts div { padding-bottom: var(--space-sm); border-bottom: 1px solid var(--color-rule); }
}
</style>

<section id="h-school" class="sec is-paper">
  <div class="wrap">
    <a class="back" data-role="home">{{icon:home icon-sm}}回首頁</a>
    <div class="grid">
      <div>
        <p class="kicker">給學校師長・新民國小</p>
        <h1>校方專區</h1>
        <p class="lead">三日活動流程、課程設計與安全防護機制，提供學校師長與指導單位參考。</p>
      </div>
      <dl class="facts">
        <div><dt>營期</dt><dd>1/27–1/29<small>2027 年，共三天</small></dd></div>
        <div><dt>參與人數</dt><dd>96<small>志工 48 ＋ 學童 48</small></dd></div>
        <div><dt>醫療後送</dt><dd>3 分鐘<small>田中衛生所車程</small></dd></div>
      </dl>
    </div>
    <ol class="toc" aria-label="本頁內容">
      <li><a href="#s3" data-scroll>三日時程</a></li>
      <li><a href="#s4" data-scroll>特色課程</a></li>
      <li><a href="#s5" data-scroll>安全防護與急救</a></li>
      <li><a href="#s7" data-scroll>經費公示</a></li>
      <li><a href="#s10" data-scroll>聯絡我們</a></li>
    </ol>
  </div>
</section>

<script>
(function () {
  CC.roleLinks(document.getElementById("h-school"));
})();
</script>
