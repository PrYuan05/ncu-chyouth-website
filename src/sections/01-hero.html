<!-- title: 區塊1 主視覺橫幅 | body: is-ink | plugins: SplitText -->
<style>
#s1 { position: relative; overflow: clip; padding-top: var(--space-3xl); padding-bottom: var(--space-2xl); }
#s1 .hero-grid { position: relative; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 4fr); gap: var(--space-2xl); align-items: end; }
#s1 .kicker { font-size: var(--text-xs); letter-spacing: 0.18em; color: var(--color-yellow); margin-bottom: var(--space-lg); }
#s1 h1 { font-family: var(--font-display); font-weight: 900; line-height: 1.08; letter-spacing: 0.02em; min-width: 0; overflow-wrap: anywhere; }
#s1 h1 .t1 { display: block; font-size: var(--text-display); color: var(--color-on-ink); }
#s1 h1 .dash { display: block; width: 3.2em; height: 6px; margin: 0.32em 0 0.38em; background: var(--color-orange); transform-origin: left center; font-size: var(--text-display); }
#s1 h1 .t2 { display: block; font-size: calc(var(--text-display) * 0.6); color: var(--color-orange); }
#s1 .sub { margin-top: var(--space-xl); font-size: var(--text-lg); font-weight: 700; color: var(--color-on-ink); max-width: 34em; }
#s1 .tag { margin-top: var(--space-xs); color: var(--color-on-ink-muted); max-width: 34em; }
#s1 .facts { position: relative; z-index: 1; border-top: 1px solid var(--color-rule-on-ink); }
#s1 .facts div { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: var(--space-sm); padding: var(--space-sm) 0; border-bottom: 1px solid var(--color-rule-on-ink); }
#s1 .facts dt { font-family: var(--font-mono); font-size: var(--text-xs); letter-spacing: 0.12em; color: var(--color-on-ink-muted); padding-top: 3px; }
#s1 .facts dd { font-weight: 500; }
#s1 .facts .pill { margin-top: 2px; }
#s1 .main { position: relative; }
#s1 .side { display: grid; gap: var(--space-md); }
#s1 .stage { position: relative; width: min(100%, 360px); aspect-ratio: 1 / 0.92; margin: 0 auto; }
#s1 .stage::before { content: ""; position: absolute; left: 12%; right: 12%; bottom: 6%; height: 14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(245, 128, 39, 0.35), transparent); filter: blur(6px); }
#s1 .stage canvas, #s1 .stage .xz-still { position: relative; width: 100%; height: 100%; object-fit: contain; }
#s1 .stage button { position: absolute; inset: 8% 14%; border: 0; border-radius: 50%; background: none; cursor: pointer; }
#s1 .stage button:focus-visible { outline: 3px solid var(--color-focus-on-ink); outline-offset: 2px; }
#s1 .bubble { position: absolute; left: 50%; top: 2%; z-index: 2; padding: 6px 14px; border-radius: var(--radius-pill); background: rgba(255, 251, 235, 0.92); color: var(--color-ink); font: 900 var(--text-base)/1.4 var(--font-display); white-space: nowrap; transform: translateX(-50%); opacity: 0; pointer-events: none; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); }
#s1 .cta { display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-2xl); padding-top: var(--space-xl); border-top: 1px solid var(--color-rule-on-ink); }
#s1 .cta .btn { gap: var(--space-sm); }
#s1 .cta small { font-size: var(--text-xs); font-weight: 700; opacity: 0.85; }
@media (max-width: 860px) {
  #s1 .hero-grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
  #s1 .stage { width: min(72%, 280px); }
}
@media (max-width: 480px) {
  #s1 .cta { flex-direction: column; }
  #s1 .cta .btn { justify-content: space-between; }
}
</style>

<section id="s1" class="sec is-ink">
  <div class="wrap">
    <div class="hero-grid">
      <div class="main">
        <p class="kicker mono">NCU · CHANGHUA · 21ST · 2027</p>
        <h1 aria-label="名偵探柯南——真相與科學探險記">
          <span class="t1" aria-hidden="true">名偵探柯南</span>
          <span class="dash" aria-hidden="true"></span>
          <span class="t2" aria-hidden="true">真相與科學探險記</span>
        </h1>
        <p class="sub">2027 國立中央大學彰友會第 21 屆返鄉服務隊寒假育樂營</p>
        <p class="tag">用愛與陪伴守護家鄉孩子・激發偏鄉學童科學好奇心</p>
      </div>
      <div class="side">
      <div class="stage">
        <p class="bubble" aria-live="polite"></p>
        <button type="button" aria-label="點小章：真相只有一個" data-cursor="點我 CLICK"></button>
      </div>
      <dl class="facts" aria-label="營隊資訊">
        <div><dt>營期</dt><dd class="num">2027／1／27（三）～ 1／29（五）</dd></div>
        <div><dt>地點</dt><dd>彰化縣田中鎮新民國民小學</dd></div>
        <div><dt>陪伴</dt><dd class="num">48 位大專志工 × 48 位學童</dd></div>
        <div><dt>費用</dt><dd><span class="pill pill-orange">學員全程免費</span></dd></div>
      </dl>
      </div>
    </div>
    <nav class="cta" aria-label="依身分進入專區">
      <a class="btn btn-orange" data-role="parents"><small>我是家長</small>家長專區{{icon:arrow-right icon-sm}}</a>
      <a class="btn btn-ghost-ink" data-role="sponsor"><small>企業・基金會</small>企業夥伴專區{{icon:arrow-right icon-sm}}</a>
      <a class="btn btn-ghost-ink" data-role="school"><small>學校師長</small>校方專區{{icon:arrow-right icon-sm}}</a>
    </nav>
  </div>
</section>

<script>
(function () {
  CC.register();
  var root = document.getElementById("s1");
  CC.roleLinks(root);

  CC.motion(function () {
    var split = window.SplitText ? new SplitText(root.querySelectorAll(".t1, .t2"), { type: "chars", mask: "chars" }) : null;
    var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
    if (split) tl.from(split.chars, { yPercent: 110, duration: 0.7, stagger: 0.045 }, 0.1);
    tl.from(root.querySelector(".dash"), { scaleX: 0, duration: 0.6 }, 0.35)
      .from(root.querySelector(".stage"), { y: 40, scale: 0.85, autoAlpha: 0, duration: 1.1, ease: "back.out(1.6)" }, 0.2)
      .from(root.querySelectorAll(".sub, .tag"), { y: 16, autoAlpha: 0, duration: 0.5, stagger: 0.08 }, 0.7)
      .from(root.querySelectorAll(".facts > div"), { x: 16, autoAlpha: 0, duration: 0.45, stagger: 0.06 }, 0.8)
      .from(root.querySelectorAll(".cta .btn"), { y: 12, autoAlpha: 0, duration: 0.4, stagger: 0.06 }, 1.0);
    CC.intro(function () { tl.play(); });
    return function () { if (split) split.revert(); };
  });

  /* 小章：眼睛跟著滑鼠，點一下推眼鏡說「真相只有一個」 */
  var stage = root.querySelector(".stage");
  var bubble = stage.querySelector(".bubble");
  var LINES = ["真相只有一個！", "線索就在營隊裡！", "1/28 營火晚會見！", "一起來當小偵探！"];
  var said = 0;
  CC.mascot(stage, { pose: "wave" }, function (api) {
    if (api) stage.insertBefore(api.renderer.domElement, bubble);
    window.addEventListener("pointermove", function (e) {
      if (!api) return;
      var r = stage.getBoundingClientRect();
      api.look((e.clientX - (r.left + r.width / 2)) / (window.innerWidth / 2), (e.clientY - (r.top + r.height / 2)) / (window.innerHeight / 2));
    }, { passive: true });
    stage.querySelector("button").addEventListener("click", function () {
      bubble.textContent = LINES[said++ % LINES.length];
      if (api) { api.pose("glint"); api.glint(); setTimeout(function () { api.pose("wave"); }, 1600); }
      if (window.gsap) gsap.fromTo(bubble, { autoAlpha: 0, y: 8, xPercent: -50, x: 0 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "back.out(2)", onComplete: function () { gsap.to(bubble, { autoAlpha: 0, delay: 1.6, duration: 0.3 }); } });
      else bubble.style.opacity = 1;
    });
  });
})();
</script>
