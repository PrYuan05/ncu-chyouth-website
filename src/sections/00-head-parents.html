<!-- title: 家長專區頁首 | body: is-ink | plugins: -->
<style>
#h-parents { padding-top: var(--space-2xl); padding-bottom: var(--space-2xl); }
#h-parents .back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: var(--text-sm); color: var(--color-on-ink-muted); text-decoration: none; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out); }
#h-parents .back:hover { color: var(--color-orange); }
#h-parents .back:focus-visible { outline: 3px solid var(--color-focus-on-ink); outline-offset: 2px; transition: none; }
#h-parents .grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--space-2xl); align-items: end; margin-top: var(--space-lg); }
#h-parents .kicker { font-size: var(--text-xs); letter-spacing: 0.18em; color: var(--color-yellow); }
#h-parents h1 { margin-top: var(--space-xs); font-family: var(--font-display); font-weight: 900; font-size: clamp(2.25rem, 1.5rem + 3.5vw, 4rem); line-height: 1.15; }
#h-parents .lead { margin-top: var(--space-md); color: var(--color-on-ink-muted); font-size: var(--text-lg); max-width: 28em; }
#h-parents .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--color-rule-on-ink); }
#h-parents .facts div { padding: var(--space-md) var(--space-sm) 0 0; }
#h-parents .facts dt { font-size: var(--text-xs); color: var(--color-on-ink-muted); }
#h-parents .facts dd { margin-top: 2px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--text-xl); color: var(--color-orange); line-height: 1.3; }
#h-parents .facts dd small { display: block; font-family: var(--font-body); font-size: var(--text-xs); font-weight: 400; color: var(--color-on-ink-muted); }
#h-parents .toc { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); margin-top: var(--space-2xl); padding-top: var(--space-md); border-top: 1px solid var(--color-rule-on-ink); font-size: var(--text-sm); color: var(--color-on-ink-muted); counter-reset: toc; }
#h-parents .toc li { display: flex; align-items: center; gap: 6px; counter-increment: toc; }
#h-parents .toc a { display: inline-flex; align-items: center; min-height: 40px; color: inherit; text-decoration: none; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out); }
#h-parents .toc a:hover { color: var(--color-on-ink); }
#h-parents .toc a:focus-visible { outline: 3px solid var(--color-focus-on-ink); outline-offset: 2px; }
#h-parents .toc li::before { content: counter(toc, decimal-leading-zero) " "; font-family: var(--font-mono); color: var(--color-yellow); }
#h-parents .ask { position: relative; margin-top: var(--space-2xl); padding: var(--space-lg); border-radius: var(--radius-md); background: var(--color-ink-3); border: 1px solid var(--color-rule-on-ink); }
#h-parents .ask .xz { position: absolute; right: var(--space-md); bottom: calc(100% - 26px); width: 92px; height: auto; pointer-events: none; transform-origin: 50% 90%; }
#h-parents .ask-label { padding-right: 96px; }
#h-parents .ask-label { display: flex; align-items: center; gap: var(--space-xs); font-weight: 700; }
#h-parents .ask-label .icon { color: var(--color-orange); }
#h-parents kbd { margin-left: auto; padding: 2px 8px; border: 1px solid var(--color-rule-on-ink); border-radius: var(--radius-sm); font: 600 var(--text-xs)/1.6 var(--font-mono); color: var(--color-on-ink-muted); }
#h-parents .ask input { width: 100%; min-height: 52px; margin-top: var(--space-sm); padding: 0 var(--space-md); border: 2px solid transparent; border-radius: var(--radius-md); background: var(--color-paper); color: var(--color-ink); font: 500 var(--text-lg)/1.4 var(--font-body); }
#h-parents .ask input::placeholder { color: var(--color-ink-2); }
#h-parents .ask input:focus { outline: none; border-color: var(--color-orange); }
#h-parents .chips { display: flex; flex-wrap: wrap; gap: var(--space-xs); margin-top: var(--space-sm); }
#h-parents .chips button { min-height: 40px; padding: 0 var(--space-md); border: 1px solid var(--color-rule-on-ink); border-radius: var(--radius-pill); background: transparent; color: var(--color-on-ink); font: 500 var(--text-sm)/1 var(--font-body); cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out); }
#h-parents .chips button:hover { border-color: var(--color-orange); color: var(--color-orange); }
#h-parents .chips button:focus-visible { outline: 3px solid var(--color-focus-on-ink); outline-offset: 2px; }
#h-parents .results { display: grid; gap: var(--space-sm); margin-top: var(--space-md); }
#h-parents .results:empty { display: none; }
#h-parents .results li { padding: var(--space-md); border-left: 3px solid var(--color-orange); border-radius: var(--radius-sm); background: rgba(255, 251, 235, 0.06); }
#h-parents .results .q { font-weight: 700; }
#h-parents .results .a { margin-top: 4px; color: var(--color-on-ink-muted); }
#h-parents .results mark { background: transparent; color: var(--color-orange); font-weight: 700; }
#h-parents .results .none a { color: var(--color-orange); }
@media (max-width: 860px) {
  #h-parents .grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
}
@media (max-width: 480px) {
  #h-parents .facts { grid-template-columns: minmax(0, 1fr); }
  #h-parents .facts div { padding-bottom: var(--space-sm); border-bottom: 1px solid var(--color-rule-on-ink); }
}
</style>

<section id="h-parents" class="sec is-ink">
  <div class="wrap">
    <a class="back" data-role="home">{{icon:home icon-sm}}回首頁</a>
    <div class="grid">
      <div>
        <p class="kicker mono">PARENTS · 2027.01.27–29</p>
        <h1>家長專區</h1>
        <p class="lead">營期三天的同意書、接送時間、課程內容與安全措施，都整理在這一頁。</p>
      </div>
      <dl class="facts">
        <div><dt>同意書截止</dt><dd>1/15<small>2027 年，線上填寫</small></dd></div>
        <div><dt>每日報到</dt><dd>08:00<small>新民國小大門口</small></dd></div>
        <div><dt>1/28 營火晚會放學</dt><dd>21:00<small>學童留校吃免費晚餐</small></dd></div>
      </dl>
    </div>
    <div class="ask" role="search">
      <img class="xz" src="{{asset:mascot/xiaozhang-magnify.svg}}" alt="" width="120" height="114">
      <label class="ask-label" for="ask-q">{{icon:search icon-sm}}家長快速查詢<kbd class="kbd" aria-hidden="true">Ctrl K</kbd></label>
      <input id="ask-q" type="search" autocomplete="off" enterkeyhint="search" placeholder="輸入「接送」「帶什麼」「保險」…">
      <div class="chips" aria-label="常見問題"></div>
      <p class="sr-only" aria-live="polite" data-status></p>
      <ol class="results"></ol>
    </div>
    <ol class="toc" aria-label="本頁內容">
      <li><a href="#s9" data-scroll>家長安心專區與線上同意書</a></li>
      <li><a href="#s3" data-scroll>三日時程</a></li>
      <li><a href="#s4" data-scroll>特色課程</a></li>
      <li><a href="#s5" data-scroll>安全防護與急救</a></li>
      <li><a href="#s10" data-scroll>聯絡我們</a></li>
    </ol>
  </div>
</section>

<script>
(function () {
  var root = document.getElementById("h-parents");
  CC.roleLinks(root);

  // 家長常見問題：改這裡就會更新查詢結果。keys 是會對應到這題的關鍵字。
  var FAQ = [
    { q: "參加要繳費嗎？", a: "不用。學員三天全程免費，午餐便當與第二天晚餐都由營隊補助。", keys: ["費用", "免費", "錢", "報名費", "繳費"] },
    { q: "每天幾點報到、幾點接回？", a: "每天 08:00～08:30 在新民國小大門口報到。1/27（三）與 1/29（五）17:00 放學；1/28（四）有營火晚會，21:00 放學。", keys: ["接送", "報到", "放學", "幾點", "時間", "接"] },
    { q: "第二天為什麼比較晚放學？", a: "1/28 晚上是營火晚會。孩子留校吃免費晚餐，19:00～21:00 晚會，結束後請家長到校門口接回。", keys: ["營火", "晚會", "晚餐", "21:00", "晚"] },
    { q: "可以請親友代接嗎？", a: "可以，但請提前告知營本部。每天放學都要由接送人到校門口親筆簽名。", keys: ["代接", "親友", "爺爺", "奶奶", "簽名", "接"] },
    { q: "孩子要帶什麼？", a: "水壺、健保卡、個人常備藥物、環保餐具、保暖外套。", keys: ["帶什麼", "攜帶", "物品", "健保卡", "外套", "水壺", "帶"] },
    { q: "同意書在哪裡填？期限是？", a: "本頁下方的線上表單，請在 2027 年 1 月 15 日前填完。個資只用於投保與營期緊急醫療聯繫。", keys: ["同意書", "表單", "報名", "期限", "個資", "填"] },
    { q: "有保險嗎？", a: "有。全體學童與志工都投保活動平安保險（意外醫療實支實付），並另外查核教育部在校學生團體平安險資格。", keys: ["保險", "平安險", "意外"] },
    { q: "孩子受傷或身體不舒服怎麼辦？有過敏要告訴誰？", a: "隨隊隊輔立即處理，合格急救員 60 秒內帶醫療箱到場，同時通知家長與學校。需要就醫時專車送田中衛生所（3 分鐘）或員榮醫院（10 分鐘內）。過敏或特殊狀況請寫在同意書的健康調查表。", keys: ["受傷", "生病", "急救", "醫院", "過敏", "藥", "不舒服"] },
    { q: "三天在做什麼？", a: "生活科學實驗、創意美勞、烘焙手作、柯南實境解謎、大地遊戲和營火晚會，詳細時間看本頁的三日時程。", keys: ["課程", "課表", "活動", "做什麼", "內容"] },
    { q: "在哪裡看活動照片？有問題找誰？", a: "每天晚上更新當天相簿，連結在本頁的家長安心專區。其他問題請找營隊執行長李元皓 0908-805-897。", keys: ["照片", "相簿", "聯絡", "電話", "執行長", "問題"] }
  ];
  var CHIPS = ["幾點接送", "要帶什麼", "費用", "同意書", "受傷怎麼辦"];

  var input = root.querySelector("#ask-q");
  var list = root.querySelector(".results");
  var status = root.querySelector("[data-status]");
  var chips = root.querySelector(".chips");
  if (/Mac|iPhone|iPad/.test(navigator.platform)) root.querySelector(".kbd").textContent = "⌘ K";

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function score(item, q) {
    var s = 0;
    item.keys.forEach(function (k) { if (q.indexOf(k) > -1 || k.indexOf(q) > -1) s += 3; });
    if (item.q.indexOf(q) > -1) s += 2;
    if (item.a.indexOf(q) > -1) s += 1;
    var hits = 0;
    for (var i = 0; i < q.length; i++) if (/\S/.test(q[i]) && item.q.indexOf(q[i]) > -1) hits++;
    if (hits >= 2) s += hits / q.length;
    return s;
  }
  // 小章助手：找到答案點頭、找不到搖頭。
  var xz = root.querySelector(".xz"), mood = "magnify";
  function react(next) {
    if (next === mood) return;
    xz.src = CC.sprite(next); mood = next;
    if (!window.gsap || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    gsap.killTweensOf(xz);
    gsap.set(xz, { rotation: 0, x: 0, y: 0 });
    if (next === "glint") gsap.to(xz, { y: 6, duration: 0.14, yoyo: true, repeat: 3, ease: "power1.inOut" });
    else if (next === "surprise") gsap.to(xz, { keyframes: { x: [0, -8, 8, -6, 6, 0], rotation: [0, -6, 6, -4, 4, 0] }, duration: 0.6, ease: "none" });
  }
  function render() {
    var q = input.value.trim();
    if (!q) { list.innerHTML = ""; status.textContent = ""; react("magnify"); return; }
    var found = FAQ.map(function (item) { return { item: item, s: score(item, q) }; })
      .filter(function (r) { return r.s > 0.5; })
      .sort(function (a, b) { return b.s - a.s; })
      .slice(0, 3);
    if (!found.length) {
      list.innerHTML = '<li class="none"><p class="q">找不到相關問題</p><p class="a">請直接聯絡營隊執行長李元皓 <a href="tel:0908805897">0908-805-897</a>。</p></li>';
      status.textContent = "找不到相關問題";
      react("surprise");
      return;
    }
    var mark = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "g");
    list.innerHTML = found.map(function (r) {
      return '<li><p class="q">' + esc(r.item.q).replace(mark, "<mark>$1</mark>") + '</p><p class="a">' + esc(r.item.a).replace(mark, "<mark>$1</mark>") + "</p></li>";
    }).join("");
    status.textContent = "找到 " + found.length + " 個相關問題";
    react("glint");
    if (window.gsap && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      gsap.from(list.children, { y: 8, autoAlpha: 0, duration: 0.3, stagger: 0.05, ease: "power2.out" });
    }
  }
  CHIPS.forEach(function (c) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = c;
    b.addEventListener("click", function () { input.value = c; render(); });
    chips.appendChild(b);
  });
  input.addEventListener("input", render);
  input.addEventListener("keydown", function (e) { if (e.key === "Escape") { input.value = ""; render(); } });
  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k" && !root.hidden) {
      e.preventDefault();
      CC.scrollTo ? CC.scrollTo(root) : root.scrollIntoView();
      input.focus({ preventScroll: true });
    }
  });
})();
</script>
