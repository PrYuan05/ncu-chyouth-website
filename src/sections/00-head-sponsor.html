<!-- title: 企業夥伴專區頁首 | body: is-paper | plugins: -->
<style>
/* 各專區頁首用暖色紙底，和首頁一樣；深藍只留給最上面的頁首列和頁尾 */
#h-sponsor { padding-top: var(--space-2xl); padding-bottom: var(--space-2xl); background: radial-gradient(ellipse at 85% 0%, #EBD8C4, transparent 55%), var(--color-paper); border-bottom: 1px solid var(--color-rule); }
#h-sponsor .back { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; font-size: var(--text-sm); color: var(--color-ink-2); text-decoration: none; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out); }
#h-sponsor .back:hover { color: var(--color-orange-ink); }
#h-sponsor .back:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; transition: none; }
#h-sponsor .grid { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: var(--space-2xl); align-items: end; margin-top: var(--space-lg); }
#h-sponsor .kicker { font-size: var(--text-sm); font-weight: 700; letter-spacing: 0.06em; color: var(--color-orange-ink); }
#h-sponsor h1 { margin-top: var(--space-xs); font-family: var(--font-display); font-weight: 900; font-size: clamp(2.25rem, 1.5rem + 3.5vw, 4rem); line-height: 1.15; }
#h-sponsor .lead { margin-top: var(--space-md); color: var(--color-ink-2); font-size: var(--text-lg); max-width: 28em; }
#h-sponsor .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--color-rule-strong); }
#h-sponsor .facts div { padding: var(--space-md) var(--space-sm) 0 0; }
#h-sponsor .facts dt { font-size: var(--text-xs); color: var(--color-ink-2); }
#h-sponsor .facts dd { margin-top: 2px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--text-xl); color: var(--color-orange-ink); line-height: 1.3; }
#h-sponsor .facts dd small { display: block; font-family: var(--font-body); font-size: var(--text-xs); font-weight: 400; color: var(--color-ink-2); }
#h-sponsor .toc { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg); margin-top: var(--space-2xl); padding-top: var(--space-md); border-top: 1px solid var(--color-rule); font-size: var(--text-sm); color: var(--color-ink-2); counter-reset: toc; }
#h-sponsor .toc li { display: flex; align-items: center; gap: 6px; counter-increment: toc; }
#h-sponsor .toc a { display: inline-flex; align-items: center; min-height: 40px; color: inherit; text-decoration: none; border-radius: var(--radius-sm); transition: color var(--dur-fast) var(--ease-out); }
#h-sponsor .toc a:hover { color: var(--color-ink); }
#h-sponsor .toc a:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
#h-sponsor .toc li::before { content: counter(toc, decimal-leading-zero) " "; font-family: var(--font-mono); color: var(--color-orange-ink); }
@media (max-width: 860px) {
  #h-sponsor .grid { grid-template-columns: minmax(0, 1fr); gap: var(--space-xl); }
}
@media (max-width: 480px) {
  #h-sponsor .facts { grid-template-columns: minmax(0, 1fr); }
  #h-sponsor .facts div { padding-bottom: var(--space-sm); border-bottom: 1px solid var(--color-rule); }
}
</style>

<section id="h-sponsor" class="sec is-paper">
  <div class="wrap">
    <a class="back" data-role="home">{{icon:home icon-sm}}回首頁</a>
    <div class="grid">
      <div>
        <p class="kicker">給企業與基金會・2027 第 21 屆</p>
        <h1>企業夥伴專區</h1>
        <p class="lead">曝光回饋、經費結構與專款用途一次看清楚，方便承辦人整理後向內部呈報。</p>
      </div>
      <dl class="facts">
        <div><dt>全案總經費</dt><dd>NT$120,540<small>學童全程免費</small></dd></div>
        <div><dt>志工自籌與待募</dt><dd>77.2%<small>贊助可直接減輕自籌</small></dd></div>
        <div><dt>成果報告寄送</dt><dd>2/28<small>2027 年，含感謝狀與單據</small></dd></div>
      </dl>
    </div>
    <ol class="toc" aria-label="本頁內容">
      <li><a href="#s8" data-scroll>合作效益與曝光回饋</a></li>
      <li><a href="#s7" data-scroll>經費來源與運用</a></li>
      <li><a href="#s6" data-scroll>歷屆服務足跡</a></li>
      <li><a href="#s10" data-scroll>聯絡我們</a></li>
    </ol>
  </div>
</section>

<script>
(function () {
  CC.roleLinks(document.getElementById("h-sponsor"));
})();
</script>
