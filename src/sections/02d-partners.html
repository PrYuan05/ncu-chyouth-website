<!-- title: 合作夥伴跑馬燈 | body: is-paper-2 | plugins: -->
<style>
#s13 { position: relative; padding: var(--space-2xl) 0; overflow: hidden; background: linear-gradient(120deg, #FDF1D3 0%, #FFE7CC 45%, #E6EEF9 100%); }
#s13::before, #s13::after { content: ""; position: absolute; border-radius: 50%; filter: blur(48px); opacity: 0.55; pointer-events: none; }
#s13::before { width: 340px; height: 340px; left: -80px; top: -140px; background: #F8963F; }
#s13::after { width: 300px; height: 300px; right: -60px; bottom: -160px; background: #8FB4E8; }
#s13 > .wrap { width: calc(100% - 2 * var(--space-lg)); }
@media (max-width: 640px) { #s13 > .wrap { width: calc(100% - 2 * var(--space-md)); } }
#s13 .head { position: relative; z-index: 1; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: var(--space-sm) var(--space-lg); }
#s13 .head p { font-size: var(--text-sm); font-weight: 700; line-height: 1.5; letter-spacing: 0.06em; color: var(--color-orange-ink); }
#s13 .head h2 { margin-top: 2px; font-family: var(--font-display); font-weight: 900; font-size: var(--text-2xl); line-height: 1.3; }
#s13 .head a { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 700; color: var(--color-ink); text-underline-offset: 4px; border-radius: var(--radius-sm); }
#s13 .head a:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }
#s13 .band { position: relative; z-index: 1; margin-top: var(--space-lg); -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); }
#s13 .track { display: flex; width: max-content; }
#s13 .run { display: flex; flex: none; gap: var(--space-md); padding-right: var(--space-md); }
#s13 .chip {
  display: flex; align-items: center; gap: var(--space-sm); flex: none; min-height: 84px; padding: var(--space-sm) var(--space-lg);
  border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.85);
  background: rgba(255, 255, 255, 0.5); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: 0 10px 30px rgba(30, 41, 59, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.9);
  color: var(--color-ink); text-decoration: none; transition: background-color var(--dur-med) var(--ease-out), transform var(--dur-med) var(--ease-out);
}
#s13 a.chip:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-3px); }
@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  #s13 .chip, #s13 a.chip:hover { background: var(--color-paper); border-color: var(--color-rule-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
#s13 a.chip:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
#s13 .chip img { display: block; height: 48px; width: auto; max-width: 160px; object-fit: contain; }
#s13 .chip .mark { display: grid; place-items: center; width: 48px; height: 48px; flex: none; border-radius: 14px; background: linear-gradient(140deg, var(--color-orange-soft), var(--color-orange)); color: var(--color-ink); font: 900 var(--text-xl)/1 var(--font-display); }
#s13 .chip b { display: block; font-weight: 700; font-size: var(--text-base); white-space: nowrap; }
#s13 .chip small { display: block; margin-top: 2px; font: 600 var(--text-xs)/1.4 var(--font-mono); letter-spacing: 0.1em; color: var(--color-ink-2); white-space: nowrap; }
#s13 .chip.is-open { border-style: dashed; border-color: rgba(163, 74, 11, 0.45); background: rgba(255, 244, 230, 0.55); }
#s13 .chip.is-open .mark { background: transparent; border: 1.5px dashed var(--color-orange-ink); color: var(--color-orange-ink); }
#s13 .list { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: var(--space-sm); margin-top: var(--space-lg); }
@media (prefers-reduced-motion: reduce) { #s13 .band { -webkit-mask-image: none; mask-image: none; } }
</style>

<section id="s13" class="sec" aria-labelledby="s13-title">
  <div class="wrap">
    <div class="head">
      <div>
        <p>謝謝你們的支持</p>
        <h2 id="s13-title">一起守護家鄉孩子的夥伴</h2>
      </div>
      <a href="#s10" data-scroll="#s10">合作洽詢{{icon:arrow-right icon-sm}}</a>
    </div>
  </div>
  <div class="band" aria-hidden="true"><div class="track"></div></div>
  <ul class="list wrap sr-only"></ul>
</section>

<script>
(function () {
  // 合作夥伴清單：新增一家就多加一行。logo 放 assets/partners/ 後填檔名，沒有 logo 會用名稱第一個字當標誌；url 可留空。
  var PARTNERS = [
    { name: "教育部 教育優先區計畫", role: "指導補助單位" },
    { name: "國立中央大學 課外活動組", role: "補助單位" },
    { name: "彰化縣田中鎮新民國民小學", role: "合作學校" },
    { name: "國立中央大學彰化校友會", role: "主辦單位" }
  ];
  var OPEN = { name: "虛位以待", role: "成為下一位夥伴 →" };

  var root = document.getElementById("s13");
  var track = root.querySelector(".track");
  var list = root.querySelector(".list");

  function chip(p, open) {
    var el = document.createElement(p.url ? "a" : "div");
    el.className = "chip" + (open ? " is-open" : "");
    if (p.url) { el.href = p.url; el.target = "_blank"; el.rel = "noopener"; el.tabIndex = -1; }
    if (p.logo) {
      var img = new Image(); img.alt = ""; img.src = "assets/partners/" + p.logo; el.appendChild(img);
    } else {
      var m = document.createElement("span"); m.className = "mark"; m.textContent = open ? "＋" : p.name.charAt(0); el.appendChild(m);
    }
    var t = document.createElement("span");
    t.innerHTML = "<b></b><small></small>";
    t.querySelector("b").textContent = p.name;
    t.querySelector("small").textContent = p.role;
    el.appendChild(t);
    return el;
  }

  PARTNERS.forEach(function (p) {
    var li = document.createElement("li");
    li.textContent = p.role + "：" + p.name;
    list.appendChild(li);
  });

  var run = document.createElement("div");
  run.className = "run";
  PARTNERS.forEach(function (p) { run.appendChild(chip(p)); });
  run.appendChild(chip(OPEN, true));
  track.appendChild(run);

  // Repeat the run until one copy is wider than the screen, then double it so the loop is seamless.
  function fill() {
    while (track.children.length > 1) track.removeChild(track.lastChild);
    var w = run.getBoundingClientRect().width || 1;
    var copies = Math.max(1, Math.ceil(window.innerWidth / w));
    for (var i = 1; i < copies * 2; i++) track.appendChild(run.cloneNode(true));
    return copies;
  }

  var copies = fill();
  CC.motion(function () {
    var loop;
    function start() {
      if (loop) loop.kill();
      gsap.set(track, { x: 0 });
      var dist = run.getBoundingClientRect().width * copies;
      loop = gsap.to(track, { x: -dist, duration: dist / 45, ease: "none", repeat: -1 });
    }
    start();
    var resize = function () { copies = fill(); start(); };
    var t;
    var onResize = function () { clearTimeout(t); t = setTimeout(resize, 200); };
    window.addEventListener("resize", onResize);
    var band = root.querySelector(".band");
    band.addEventListener("pointerenter", function () { gsap.to(loop, { timeScale: 0.15, duration: 0.6 }); });
    band.addEventListener("pointerleave", function () { gsap.to(loop, { timeScale: 1, duration: 0.6 }); });
    return function () { window.removeEventListener("resize", onResize); if (loop) loop.kill(); };
  });
})();
</script>
